<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUV Notify Body Poll</title>
  <link rel="stylesheet" href="styles.css">
  <script src="supabase-config.js"></script>
</head>
<body>

<main class="poll-page">
  <div class="poll-container">
    <h2 id="poll-question">Which Notified Body (NB) is your favorite ?</h2>
    <form id="poll-form">
      <label class="option"><input type="radio" name="poll" value="TUV Nord"> TUV Nord</label>
      <label class="option"><input type="radio" name="poll" value="TUV Rheinland"> TUV Rheinland</label>
      <label class="option"><input type="radio" name="poll" value="TUV Sud"> TUV Sud</label>
      <button type="submit">Submit Vote</button>
    </form>
  </div>

  <section class="results-chart" id="results-container" aria-labelledby="results-heading">
    <h2 id="results-heading">Poll Results</h2>
    <div class="bar-chart" id="results-list" role="list" aria-label="Votes by notify body" aria-live="polite" hidden></div>
    <div class="total-votes" id="total-votes" hidden></div>
    <p class="poll-status" id="poll-status" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
  const defaultVotes = { "TUV Nord": 0, "TUV Rheinland": 0, "TUV Sud": 0 };
  const config = window.POLL_DATABASE_CONFIG || {};
  const supabaseUrl = String(config.projectUrl || '').trim().replace(/\/+$/, '');
  const supabaseKey = String(config.publicKey || '').trim();
  let votes = { ...defaultVotes };
  let databaseReady = false;
  let isSubmitting = false;
  let resultsRevision = 0;

  const form = document.getElementById('poll-form');
  const voteButton = form.querySelector('button[type="submit"]');
  const resultsList = document.getElementById('results-list');
  const totalVotesEl = document.getElementById('total-votes');
  const pollStatus = document.getElementById('poll-status');

  voteButton.disabled = true;

  if (!isValidConfiguration()) {
    setStatus('Add your Supabase project URL and public key to supabase-config.js to enable shared voting.', true);
  } else {
    setStatus('Loading cumulative results…');
    refreshResults().catch(error => {
      setStatus(`Could not load poll results: ${error.message}`, true);
    });
    window.setInterval(() => {
      if (isSubmitting || document.visibilityState !== 'visible') {
        return;
      }
      refreshResults().catch(error => {
        setStatus(`Could not refresh poll results: ${error.message}`, true);
      });
    }, 15000);
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!databaseReady || isSubmitting) {
      return;
    }

    const selected = document.querySelector('input[name="poll"]:checked');
    if (!selected) {
      alert('Please select an option before voting.');
      return;
    }

    isSubmitting = true;
    resultsRevision++;
    voteButton.disabled = true;
    setStatus('Submitting your vote…');
    try {
      const rows = await supabaseRequest('rpc/submit_poll_vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_option: selected.value })
      });
      applyResults(rows);
      form.reset();
      setStatus('Vote recorded. You can submit another vote.');
    } catch (error) {
      setStatus(`Could not record your vote: ${error.message}`, true);
    } finally {
      isSubmitting = false;
      voteButton.disabled = !databaseReady;
    }
  });

  function renderResults() {
    const total = Object.values(votes).reduce((sum, count) => sum + count, 0);
    resultsList.replaceChildren();

    for (const option of Object.keys(defaultVotes)) {
      const count = votes[option];
      const percent = total === 0 ? 0 : Math.round((count / total) * 100);
      const item = document.createElement('div');
      item.className = 'chart-item';
      item.setAttribute('role', 'listitem');

      const value = document.createElement('span');
      value.className = 'chart-value';
      value.textContent = `${percent}% (${count})`;

      const track = document.createElement('div');
      track.className = 'bar-track';
      track.setAttribute('aria-hidden', 'true');

      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.height = `${percent}%`;
      track.append(fill);

      const label = document.createElement('span');
      label.className = 'chart-label';
      label.textContent = option;

      item.append(value, track, label);
      resultsList.append(item);
    }

    totalVotesEl.textContent = `Total votes: ${total}`;
    resultsList.hidden = false;
    totalVotesEl.hidden = false;
  }

  function isValidConfiguration() {
    if (!supabaseKey) {
      return false;
    }
    try {
      const url = new URL(supabaseUrl);
      return url.protocol === 'https:' || url.protocol === 'http:';
    } catch {
      return false;
    }
  }

  async function supabaseRequest(path, options = {}) {
    const response = await fetch(`${supabaseUrl}/rest/v1/${path}`, {
      ...options,
      headers: {
        ...options.headers,
        apikey: supabaseKey
      }
    });
    if (!response.ok) {
      const details = await response.text();
      throw new Error(`Supabase returned ${response.status}${details ? `: ${details}` : ''}`);
    }
    return response.json();
  }

  async function refreshResults() {
    const revision = ++resultsRevision;
    const rows = await supabaseRequest('poll_votes?select=poll_option,vote_count&order=poll_option.asc');
    if (revision !== resultsRevision || isSubmitting) {
      return;
    }
    applyResults(rows);
    databaseReady = true;
    voteButton.disabled = false;
    setStatus('');
  }

  function applyResults(rows) {
    if (!Array.isArray(rows) || rows.length !== Object.keys(defaultVotes).length) {
      throw new Error('The database returned an unexpected poll result set.');
    }

    const updatedVotes = { ...defaultVotes };
    const seenOptions = new Set();
    for (const row of rows) {
      if (!Object.prototype.hasOwnProperty.call(updatedVotes, row.poll_option) || seenOptions.has(row.poll_option)) {
        throw new Error('The database returned an unknown or duplicate poll option.');
      }
      const count = Number(row.vote_count);
      if (!Number.isSafeInteger(count) || count < 0) {
        throw new Error('The database returned an invalid vote count.');
      }
      updatedVotes[row.poll_option] = count;
      seenOptions.add(row.poll_option);
    }

    if (seenOptions.size !== Object.keys(defaultVotes).length) {
      throw new Error('The database is missing a poll option.');
    }
    votes = updatedVotes;
    renderResults();
  }

  function setStatus(message, isError = false) {
    pollStatus.textContent = message;
    pollStatus.hidden = !message;
    pollStatus.classList.toggle('error', isError);
  }
</script>

</body>
</html>
