<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUV Notify Body Poll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="poll-container">
  <h2 id="poll-question">Which notify body is your favorate notify body?</h2>
  
  <!-- Voting Form -->
  <form id="poll-form">
    <label class="option"><input type="radio" name="poll" value="TUV Nord"> TUV Nord</label>
    <label class="option"><input type="radio" name="poll" value="TUV Rheinland"> TUV Rheinland</label>
    <label class="option"><input type="radio" name="poll" value="TUV Sud"> TUV Sud</label>
    <button type="submit">Submit Vote</button>
  </form>

  <!-- Results View -->
  <div id="results-container" style="display: none;">
    <div id="results-list"></div>
    <div class="total-votes" id="total-votes"></div>
    <button class="reset-btn" onclick="resetPoll()">Reset Poll (Demo)</button>
  </div>
</div>

<script>
  const defaultVotes = { "TUV Nord": 0, "TUV Rheinland": 0, "TUV Sud": 0 };
  const storedVotes = JSON.parse(localStorage.getItem('pollVotes')) || {};
  let votes = { ...defaultVotes };
  for (const option of Object.keys(defaultVotes)) {
    if (Number.isFinite(storedVotes[option])) {
      votes[option] = storedVotes[option];
    }
  }
  let hasVoted = localStorage.getItem('hasVoted') === 'true';

  const form = document.getElementById('poll-form');
  const resultsContainer = document.getElementById('results-container');
  const resultsList = document.getElementById('results-list');
  const totalVotesEl = document.getElementById('total-votes');

  if (hasVoted) {
    showResults();
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const selected = document.querySelector('input[name="poll"]:checked');
    if (!selected) {
      alert('Please select an option before voting.');
      return;
    }

    votes[selected.value]++;
    localStorage.setItem('pollVotes', JSON.stringify(votes));
    localStorage.setItem('hasVoted', 'true');
    showResults();
  });

  function showResults() {
    form.style.display = 'none';
    resultsContainer.style.display = 'block';
    resultsList.innerHTML = '';

    const total = Object.values(votes).reduce((sum, count) => sum + count, 0);

    for (const [option, count] of Object.entries(votes)) {
      const percent = total === 0 ? 0 : Math.round((count / total) * 100);
      resultsList.innerHTML += `
        <div class="result-item">
          <div class="result-label">
            <span>${option}</span>
            <span>${percent}% (${count})</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%"></div>
          </div>
        </div>
      `;
    }
    totalVotesEl.textContent = `Total votes: ${total}`;
  }

  function resetPoll() {
    localStorage.removeItem('pollVotes');
    localStorage.removeItem('hasVoted');
    votes = { ...defaultVotes };
    form.reset();
    resultsContainer.style.display = 'none';
    form.style.display = 'block';
  }
</script>

</body>
</html>
